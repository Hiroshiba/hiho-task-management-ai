appId: com.taskhub.app
productName: TaskHub
asar: true
npmRebuild: true
buildDependenciesFromSource: true
directories:
  output: release
files:
  - out/**
  - package.json
mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
win:
  target:
    - nsis-web
    - zip
  icon: build/icon.ico
linux:
  icon: build/icons
extraResources:
  - from: build/icon.png
    to: icon.png
nsisWeb:
  artifactName: ${productName}-Setup-${version}.${ext}
  publish:
    provider: generic
    url: https://github.com/Hiroshiba/hiho-task-management-ai/releases/download/edge
